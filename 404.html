<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartHomeQR has moved</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://smarthomeqr.vishutdhar.com/">
  <script>
    var path = location.pathname
      .replace(/\/{2,}/g, "/")
      .replace(/^\/smarthomeqr(\/|$)/, "/")
      .replace(/\/+$/, "")
      .replace(/\.html$/, "")
      .replace(/\/index$/, "")
      .replace(/\/+$/, "");
    if (path === "") { path = "/"; }
    location.replace("https://smarthomeqr.vishutdhar.com" + path + location.search + location.hash);
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://smarthomeqr.vishutdhar.com/">smarthomeqr.vishutdhar.com</a>.</p>
</body>
</html>
